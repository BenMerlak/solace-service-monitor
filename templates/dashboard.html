<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solace Service Monitor</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0b1220;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 45px 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        h1 { margin: 0 0 8px; font-size: 32px}

        p { color: #94a3b8; }

        .badge {
            padding: 10px 16px;
            background: #064e3b;
            color: #6ee7b7;
            border-radius: 30px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card, .panel {
            background: #172235;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
        }

        .value {
            margin-top: 14px;
            font-size: 32px;
            font-weight: bold;
        }

        .panel { margin-top: 22px; }

        .panel h2 { margin-top: 0; }

        .activity {
            display: flex;
            align-items: end;
            gap: 5px;
            height: 160px;
            border-bottom: 1px solid #475569;
            padding-top: 15px;
        }

        .bar {
            flex: 1;
            background: #38bdf8;
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            transition: height .3s;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 750px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; align-items: start; }
        }
    </style>
</head>

<body>
<main>
    <header>
        <div>
            <h1>Service Monitor</h1>
            <p>Containerized Flask API · Live metrics</p>
        </div>
        <span class="badge" id="health">Connecting...</span>
    </header>

    <section class="grid">
        <div class="card">
            <div class="label">Uptime</div>
            <div class="value" id="uptime">--</div>
        </div>

        <div class="card">
            <div class="label">Application Requests</div>
            <div class="value" id="requests">--</div>
        </div>

        <div class="card">
            <div class="label">Health Checks</div>
            <div class="value" id="checks">--</div>
        </div>

        <div class="card">
            <div class="label">Failed Requests</div>
            <div class="value" id="errors">--</div>
        </div>
    </section>

    <section class="panel">
        <h2>Request Activity</h2>
        <p>Application request count sampled every 3 seconds</p>
        <div class="activity" id="chart"></div>
    </section>

    <div class="footer">
        <span id="last-update">Waiting for first update...</span>
        · Local Docker deployment
    </div>
</main>


<script>
    const history = [];
    const MAX_POINTS = 30;

    function formatUptime(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remaining = Math.floor(seconds % 60);
        
        if (hours > 0) {
            return `${hours}h ${minutes}m ${remaining}s`;
        }

        return `${minutes}m ${remaining}s`;
    }

    function drawChart() {
        const chart = document.getElementById("chart");
        chart.replaceChildren();

        const maximum = Math.max(1, ...history);

        history.forEach(value => {
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.height = `${Math.max(2, value / maximum * 100)}%`;
            bar.title = `${value} application requests`;
            chart.appendChild(bar);
        });
    }

    async function updateDashboard() {
        try {
            const response = await fetch("/status", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            const metrics = data.metrics;

            document.getElementById("health").textContent = "● ONLINE";

            document.getElementById("uptime").textContent = formatUptime(data.uptime_seconds);

            document.getElementById("requests").textContent = metrics.application_requests;

            document.getElementById("checks").textContent = metrics.health_checks;

            document.getElementById("errors").textContent = metrics.failed_requests;

            // Display cumulative request samples.
            history.push(metrics.application_requests);

            if (history.length > MAX_POINTS) {
                history.shift();
            }

            drawChart();

            document.getElementById("last-update").textContent = `Last updated: ${new Date().toLocaleTimeString()}`;

        } catch (error) {
            document.getElementById("health").textContent = "● OFFLINE";

            document.getElementById("health").style.background = "#7f1d1d";

            document.getElementById("health").style.color = "#fca5a5";

            console.error("Monitoring request failed:", error);
        }
    }

    updateDashboard();
    setInterval(updateDashboard, 3000);
</script>
</body>
</html>
